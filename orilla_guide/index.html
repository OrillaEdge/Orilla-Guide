<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Orilla — End-User Guide</title>
    <style>
      /* ---------- Tokens ---------- */
      :root {
        --bg: #ffffff;
        --bg-soft: #fafaf9;
        --bg-sidebar: #f7f7f5;
        --bg-hover: #efeeec;
        --bg-code: #f4f3f1;
        --border: #e9e8e4;
        --border-strong: #d9d8d3;
        --text: #2b2a26;
        --text-muted: #6b6a64;
        --text-faint: #9a988f;
        --accent: #2f6f5e; /* deep teal — original, not branded */
        --accent-soft: #e7f0ec;
        --warn-bg: #fdf6e3;
        --warn-border: #ecdcb0;
        --warn-text: #6b5a1b;
        --info-bg: #eef3f7;
        --info-border: #cfdbe6;
        --info-text: #355370;
        --shadow:
          0 1px 0 rgba(15, 15, 15, 0.04), 0 4px 24px rgba(15, 15, 15, 0.04);
        --radius: 6px;
        --sans:
          ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--sans);
        color: var(--text);
        background: var(--bg);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
      }

      /* ---------- App Shell ---------- */
      .app {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      /* ---------- Sidebar ---------- */
      .sidebar {
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border);
        height: 100vh;
        position: sticky;
        top: 0;
        overflow-y: auto;
        padding: 20px 14px 32px;
        font-size: 14px;
      }
      .sidebar::-webkit-scrollbar {
        width: 8px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 8px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px 18px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 14px;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      .brand-name {
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      .brand-sub {
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.3;
      }

      .nav-search {
        width: 100%;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: var(--radius);
        padding: 7px 10px 7px 30px;
        font: 13px var(--sans);
        color: var(--text);
        margin-bottom: 16px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239a988f' stroke-width='2.2'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>");
        background-repeat: no-repeat;
        background-position: 9px center;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .nav-search:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .nav-section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-faint);
        padding: 14px 8px 6px;
        font-weight: 600;
      }
      .nav-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .nav-item > a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 5px;
        color: var(--text-muted);
        cursor: pointer;
        line-height: 1.35;
        transition:
          background 0.12s,
          color 0.12s;
      }
      .nav-item > a:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .nav-item.active > a {
        background: #fff;
        color: var(--text);
        font-weight: 600;
        box-shadow: inset 0 0 0 1px var(--border);
      }
      .nav-item .nav-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--border-strong);
        flex: 0 0 auto;
      }
      .nav-item.active .nav-dot {
        background: var(--accent);
      }

      .nav-sub {
        list-style: none;
        margin: 2px 0 4px 22px;
        padding: 0;
        border-left: 1px solid var(--border);
      }
      .nav-sub a {
        display: block;
        padding: 4px 10px;
        color: var(--text-muted);
        font-size: 13px;
        border-radius: 4px;
        margin-left: -1px;
        border-left: 2px solid transparent;
      }
      .nav-sub a:hover {
        color: var(--text);
      }
      .nav-sub a.active {
        color: var(--text);
        border-left-color: var(--accent);
        font-weight: 500;
      }

      /* ---------- Main ---------- */
      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: 56px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 24px;
        position: sticky;
        top: 0;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: saturate(140%) blur(6px);
        z-index: 10;
      }
      .crumbs {
        color: var(--text-muted);
        font-size: 13px;
        display: flex;
        gap: 6px;
        align-items: center;
        flex: 1;
        min-width: 0;
      }
      .crumbs .sep {
        color: var(--text-faint);
      }
      .crumbs .here {
        color: var(--text);
        font-weight: 500;
      }
      .topbar-actions {
        display: flex;
        gap: 6px;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 6px;
        cursor: pointer;
        color: var(--text-muted);
      }
      .icon-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
      }

      .menu-btn {
        display: none;
      }

      .scrim {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(20, 20, 20, 0.35);
        z-index: 40;
      }
      .scrim.show {
        display: block;
      }

      .content-wrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 48px;
        padding: 56px 64px 96px;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
      }

      .doc {
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }

      /* ---------- Document typography ---------- */
      .doc h1 {
        font-size: 40px;
        line-height: 1.15;
        letter-spacing: -0.02em;
        font-weight: 700;
        margin: 0 0 8px;
        color: var(--text);
      }
      .doc .lede {
        color: var(--text-muted);
        font-size: 17px;
        line-height: 1.55;
        margin: 0 0 8px;
      }
      .doc .meta-row {
        display: flex;
        gap: 16px;
        color: var(--text-faint);
        font-size: 13px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 18px;
        margin-bottom: 36px;
        margin-top: 18px;
      }
      .doc .meta-row span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .doc h2 {
        font-size: 26px;
        line-height: 1.25;
        letter-spacing: -0.01em;
        font-weight: 700;
        margin: 56px 0 12px;
        padding-top: 8px;
        color: var(--text);
      }
      .doc h3 {
        font-size: 19px;
        line-height: 1.3;
        font-weight: 600;
        margin: 36px 0 10px;
        color: var(--text);
      }
      .doc h4 {
        font-size: 15px;
        line-height: 1.35;
        font-weight: 600;
        margin: 24px 0 6px;
        color: var(--text);
        text-transform: none;
      }
      .doc h2[id],
      .doc h3[id],
      .doc h4[id],
      .doc h5[id] {
        scroll-margin-top: 80px;
      }
      .doc p {
        margin: 0 0 14px;
      }
      .doc ul,
      .doc ol {
        margin: 0 0 14px;
        padding-left: 22px;
      }
      .doc li {
        margin-bottom: 4px;
      }
      .doc li::marker {
        color: var(--text-faint);
      }
      .doc strong {
        font-weight: 600;
        color: var(--text);
      }
      .doc code {
        font-family: var(--mono);
        font-size: 0.88em;
        background: var(--bg-code);
        padding: 1px 5px;
        border-radius: 3px;
        color: #b03737;
      }
      .doc a.inline {
        color: var(--accent);
        border-bottom: 1px solid currentColor;
      }

      /* Section anchor — invisible but offset for sticky topbar */
      .anchor {
        display: block;
        height: 0;
        visibility: hidden;
        transform: translateY(-72px);
      }

      /* ---------- Components ---------- */
      .figure {
        margin: 18px 0 8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--bg-soft);
      }
      .figure img {
        display: block;
        width: 100%;
        height: auto;
      }
      .screenshot-trigger {
        display: block;
        position: relative;
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: zoom-in;
      }
      .screenshot-trigger::after {
        content: "";
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 32px;
        height: 32px;
        border-radius: 5px;
        background-color: rgba(0, 0, 0, 0.8);
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'><circle cx='10' cy='10' r='6'/><path d='m15 15 5 5M7 10h6M10 7v6'/></svg>");
        background-repeat: no-repeat;
        background-position: center;
        background-size: 20px 20px;
        pointer-events: none;
      }
      .screenshot-trigger:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }
      .figure figcaption {
        font-size: 13px;
        color: var(--text-muted);
        padding: 10px 14px;
        border-top: 1px solid var(--border);
        background: #fff;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .figure figcaption .label {
        font-family: var(--mono);
        font-size: 11px;
        background: var(--bg-code);
        padding: 2px 6px;
        border-radius: 3px;
        color: var(--text-muted);
        flex: 0 0 auto;
      }

      /* Full-resolution screenshot viewer */
      body.screenshot-open {
        overflow: hidden;
      }
      .screenshot-dialog {
        width: calc(100vw - 32px);
        max-width: 1440px;
        max-height: calc(100vh - 32px);
        max-height: calc(100dvh - 32px);
        padding: 0;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        background: var(--bg);
        color: var(--text);
      }
      .screenshot-dialog[open] {
        display: flex;
        flex-direction: column;
      }
      .screenshot-dialog::backdrop {
        background: rgba(0, 0, 0, 0.75);
      }
      .screenshot-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        flex-wrap: wrap;
      }
      .screenshot-header h2 {
        flex: 1 1 160px;
        margin: 0;
        font-size: 15px;
        line-height: 1.4;
      }
      .screenshot-controls {
        display: flex;
        gap: 8px;
      }
      .screenshot-controls button {
        padding: 6px 12px;
        border: 1px solid var(--border-strong);
        border-radius: 5px;
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
      }
      .screenshot-controls button:hover {
        background: var(--bg-hover);
      }
      .screenshot-controls button:focus-visible,
      .screenshot-viewport:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .screenshot-viewport {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 16px;
        background: #151515;
      }
      .screenshot-viewport img {
        display: block;
        max-width: 100%;
        width: auto;
        height: auto;
        margin: 0 auto;
      }
      .screenshot-hint {
        margin: 0;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-muted);
        flex: 0 0 auto;
      }

      .callout {
        display: flex;
        gap: 12px;
        border-radius: 8px;
        padding: 14px 16px;
        margin: 18px 0;
        border: 1px solid;
        line-height: 1.55;
      }
      .callout .cl-icon {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        margin-top: 1px;
      }
      .callout .cl-body {
        font-size: 14.5px;
      }
      .callout .cl-title {
        font-weight: 600;
        margin-bottom: 2px;
      }
      .callout.tip {
        background: var(--accent-soft);
        border-color: #c8ddd3;
        color: #1f4a3e;
      }
      .callout.tip .cl-title {
        color: #1f4a3e;
      }
      .callout.note {
        background: var(--info-bg);
        border-color: var(--info-border);
        color: var(--info-text);
      }
      .callout.warn {
        background: var(--warn-bg);
        border-color: var(--warn-border);
        color: var(--warn-text);
      }

      /* Table */
      .doc table {
        width: 100%;
        border-collapse: collapse;
        margin: 18px 0 22px;
        font-size: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .doc thead th {
        text-align: left;
        background: var(--bg-soft);
        color: var(--text-muted);
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
      }
      .doc tbody td {
        padding: 12px 14px;
        border-top: 1px solid var(--border);
        vertical-align: top;
      }
      .doc tbody tr:first-child td {
        border-top: none;
      }

      /* Role / pill chips */
      .pill {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--bg-code);
        color: var(--text-muted);
        letter-spacing: 0.03em;
      }
      .pill.admin {
        background: #efe7f7;
        color: #5a3a8c;
      }
      .pill.observer {
        background: #e7f0ec;
        color: #2f6f5e;
      }
      .pill.soon {
        background: #f4f3f1;
        color: #8a8780;
        border: 1px dashed #d9d8d3;
      }

      /* Action-type cards with icon */
      .at-card {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        background: #fff;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .at-card .at-icon {
        flex: 0 0 auto;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        display: grid;
        place-items: center;
      }
      .at-card.soon .at-icon {
        background: #f4f3f1;
        color: var(--text-faint);
      }
      .at-card .at-title {
        font-weight: 600;
        font-size: 14.5px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .at-card .at-body {
        font-size: 13.5px;
        color: var(--text-muted);
        line-height: 1.5;
        margin-top: 2px;
      }
      .at-card.soon .at-title {
        color: var(--text-muted);
      }

      /* Steps */
      .steps {
        counter-reset: step;
        list-style: none;
        padding: 0;
        margin: 14px 0 18px;
      }
      .steps > li {
        counter-increment: step;
        position: relative;
        padding: 0 0 14px 38px;
        margin-bottom: 0;
      }
      .steps > li::before {
        content: counter(step);
        position: absolute;
        left: 0;
        top: -2px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #fff;
        border: 1px solid var(--border-strong);
        color: var(--text);
        font-weight: 600;
        font-size: 13px;
        display: grid;
        place-items: center;
      }
      .steps > li:not(:last-child)::after {
        content: "";
        position: absolute;
        left: 13px;
        top: 26px;
        bottom: 0;
        width: 1px;
        background: var(--border);
      }

      /* Cards (action types etc.) */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin: 16px 0 20px;
      }
      .info-card {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        background: #fff;
      }
      .info-card .ic-title {
        font-weight: 600;
        margin-bottom: 4px;
        font-size: 14.5px;
      }
      .info-card .ic-body {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.5;
      }

      /* On-page TOC */
      .onpage-toc {
        position: sticky;
        top: 80px;
        align-self: start;
        font-size: 13px;
        border-left: 1px solid var(--border);
        padding-left: 16px;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
      }
      .onpage-toc .otoc-title {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        color: var(--text-faint);
        font-weight: 600;
        margin-bottom: 8px;
      }
      .onpage-toc a {
        display: block;
        color: var(--text-muted);
        padding: 4px 0;
        line-height: 1.4;
      }
      .onpage-toc a:hover {
        color: var(--text);
      }
      .onpage-toc a.active {
        color: var(--text);
        font-weight: 500;
      }
      .onpage-toc a.h3 {
        padding-left: 12px;
        font-size: 12.5px;
      }

      .onpage-toc a.h5 {
        padding-left: 26px;
        font-size: 12px;
      }

      /* Footer */
      .doc-footer {
        margin-top: 64px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        color: var(--text-faint);
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      /* Mobile */
      @media (max-width: 1024px) {
        .content-wrap {
          grid-template-columns: 1fr;
          padding: 36px 32px 80px;
        }
        .onpage-toc {
          display: none;
        }
      }
      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: fixed;
          inset: 0 auto 0 0;
          width: 280px;
          transform: translateX(-100%);
          transition: transform 0.25s ease;
          z-index: 50;
          box-shadow: 0 0 24px rgba(0, 0, 0, 0.08);
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .scrim.show {
          display: block;
        }
        .menu-btn {
          display: grid;
        }
        .topbar {
          padding: 0 16px;
        }
        .content-wrap {
          padding: 28px 20px 72px;
        }
        .doc h1 {
          font-size: 32px;
        }
        .doc h2 {
          font-size: 22px;
        }
      }

      /* Print */
      @media print {
        .screenshot-dialog,
        .screenshot-trigger::after {
          display: none !important;
        }
        body.screenshot-open {
          overflow: visible;
        }
        .sidebar,
        .topbar,
        .onpage-toc {
          display: none;
        }
        .app {
          grid-template-columns: 1fr;
        }
        .content-wrap {
          padding: 0;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
        <div class="brand">
          <svg
            width="120"
            height="32"
            viewBox="0 0 433 93"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path

            content: `
        <p>The Orilla login screen is your entry point to the entire platform. It is built with a dark-themed interface and keeps the experience simple: enter your credentials and you are in. The platform also supports a <strong>Remember Me</strong> option so that returning users on trusted devices do not need to re-enter credentials every session.</p>

        <h2 id="sign-up"><span class="anchor"></span>Sign up</h2>
        <p>If this is your first time on the platform, follow the steps below to create your account.</p>
        <ol class="steps">
          <li>Open the Orilla URL in your browser.</li>
          <li>You'll land on the login page. Select <strong>Sign Up</strong> to register.</li>
          <li>Please choose one of the two sign in method -LDAP or MFA.</li>
        </ol>

        <h3 id="sign-up-with-mfa"><span class="anchor"></span>Sign up with MFA</h3>
        <p>Choose <strong>MFA</strong> as your sign in option. Fill in your username, password and email.</p>
        <figure class="figure">
          <img decoding="async" data-full-height="1972" data-full-width="3820" data-full-src="images/optimized/image2.webp" src="images/optimized/image2.preview.webp" width="1600" height="826" alt="Orilla sign-up screen" loading="lazy" />

        <h4 id="license-key"><span class="anchor"></span>Enter license key</h4>
        <p>After registration, you'll be redirected to the License Key Verification screen. Enter the shared license key provided by your administrator and verify it.</p>

        <h4 id="otp"><span class="anchor"></span>OTP verification</h4>

        <figure class="figure">
          <img decoding="async" data-full-height="1666" data-full-width="2940" data-full-src="images/optimized/image6.webp" src="images/optimized/image6.preview.webp" width="1600" height="907" alt="OTP verification" loading="lazy" />
          <figcaption><span class="label">Fig 1.3</span> OTP verification screen</figcaption>
        </figure>


        <h4 id="login"><span class="anchor"></span>Log in</h4>
        <p>After successful sign-up, use your registered email and password to access the platform's full feature suite.</p>
        <figure class="figure">
          <img decoding="async" data-full-height="1986" data-full-width="3832" data-full-src="images/optimized/image3.webp" src="images/optimized/image3.preview.webp" width="1600" height="829" alt="Login screen" loading="lazy" />
          <figcaption><span class="label">Fig 1.4</span> Standard login</figcaption>
        </figure>

        <h3 id="sign-up-with-ldap"><span class="anchor"></span> Sign up with LDAP</h3>
        <p>The LDAP configuration step of the initial ORILLA sign-up flow, which comes after entering your license key and creating your admin account.</p>
        <h4 id="ldap-create-account"><span class="anchor"></span>On the account creation screen, under Authentication Type, select <strong>LDAP</strong>. Then fill in:</h4>
    
        <ul>
          <li>Username — the admin account username you want to create</li> 
          <li>Password — create a strong password</li> 
          <li>Confirm Password — re-enter the same password</li>
        </ul>
        <p>Click Create Account to proceed to LDAP server configuration.</p>
       
        <figure class="figure">
          <img decoding="async" data-full-height="1968" data-full-width="3840" data-full-src="images/optimized/ldap_create.webp" src="images/optimized/ldap_create.preview.webp" width="1600" height="820" alt="LDAP SIGN-UP screen" loading="lazy" />
          <figcaption><span class="label">Fig 1.5</span> LDAP Sign up screen</figcaption>
        </figure>

          <h4 id="ldap-server-configuration"><span class="anchor"></span>You'll now see the LDAP Server configuration form. Fill in each field as follows:</h4>
        <ul>
          <li>LDAP Server-Add Hostname or IP address of your LDAP/AD server</li>
          <li>LDAP Port- Port the LDAP service listens on</li>
          <li>Base DN- The root distinguished name under which the platform will search for users (e.g dc=planetexpress,dc=com)</li>
          <li>Bind DN- The distinguished name used to authenticate to the LDAP server (e.g cn=admin,dc=planetexpress,dc=com)</li>
          <li>LDAP Username and password- Service account username and password used to bind to the directory</li>
        </ul>  
        <figure class="figure">
          <img decoding="async" data-full-height="1980" data-full-width="3834" data-full-src="images/optimized/ldap_config.webp" src="images/optimized/ldap_config.preview.webp" width="1600" height="826" alt="LDAP configuration form" loading="lazy" />
          <figcaption><span class="label">Fig 1.6</span> LDAP configuration form</figcaption>
        </figure>
      

        <h4 id="ldap-enable-encryption"><span class="anchor"></span>Enable encryption. Under SSL Enabled, choose:</h4>
        <ul>
          <li>Yes — encrypts the connection to your LDAP server</li>
          <li>No — connects over plain, unencrypted LDAP</li>
        </ul>
        <p>If you select Yes, you'll be prompted to choose a Certificate Type.</p>     
       


        <h4 id="ldap-certificate-options"><span class="anchor"></span>Two options appear once SSL is enabled:</h4>
        <h4 id="ldap-ca-certificate">Option A — CA Certificate</h4>
        <p>Use this if your LDAP server's certificate is signed by a trusted Certificate Authority. No additional file uploads are required on this screen</p>
        <h4 id="ldap-client-certificate">Option B — Client Certificate</h4>
        <p>Use this for mutual TLS (mTLS), where the LDAP server requires user to present its own certificate. Selecting this option reveals two upload fields:</p>
        <ul>
          <li>Client Certificate-Your client certificate file</li>
          <li>Client Key-The private key matching that certificate</li>
        </ul>
        <p>Click Choose file next to each field and select the corresponding file from your machine.</p>  
         <figure class="figure">
          <img decoding="async" data-full-height="1990" data-full-width="3836" data-full-src="images/optimized/ldap_config_ssl.webp" src="images/optimized/ldap_config_ssl.preview.webp" width="1600" height="830" alt="LDAP configuration form" loading="lazy" />
          <figcaption><span class="label">Fig 1.7</span> LDAP configuration form</figcaption>
        </figure>



        <h4 id="ldap-register-and-sign-in"><span class="anchor"></span>Once all fields are filled in correctly, click Register to save the LDAP configuration. You'll be returned to the Sign In screen. Log in using:</h4>
        <ul>

        <h4 id="ldap-access-management"><span class="anchor"></span>After signing in, navigate to Access Management. A default admin role listed under Roles, with a description of System Administrator will be added . From here you can:  </h4>

          <img decoding="async" data-full-height="1996" data-full-width="3838" data-full-src="images/optimized/ldap_access_mgnmt.webp" src="images/optimized/ldap_access_mgnmt.preview.webp" width="1600" height="832" alt="Access management" loading="lazy" />

        </figure>
         <figure class="figure">

          <figcaption><span class="label">Fig 1.10.2</span> Create User 1b</figcaption>
        </figure>
     




        <h2 id="forgot-password"><span class="anchor"></span>Forgot password</h2>
        <p>If you cannot recall your password, use the self-service reset flow built into the login screen:</p>
        <ol class="steps">
          <li>Click <strong>Forgot Password?</strong> below the password field.</li>
          <li>Enter the email address associated with your account.</li>
          <li>Orilla sends a password reset link to that email.</li>
          <li>Click the link in your inbox to access the reset page. Set and confirm your new password.</li>
          <li>Once the reset is complete, return to the login screen and sign in with your new credentials.</li>
        </ol>
            <div class="callout note">
          <div class="cl-icon">ℹ</div>
          <div class="cl-body"><div class="cl-title">Note</div>The password reset link expires in 2 hours. If you miss the window, click 'Forgot your password?' again to request a fresh link.</div>
        </div>
        
        <figure class="figure">
          <img decoding="async" data-full-height="1698" data-full-width="3798" data-full-src="images/optimized/image1a.webp" src="images/optimized/image1a.preview.webp" width="1600" height="715" alt="Forgot password flow" loading="lazy" />

        <h2 id="change-password"><span class="anchor"></span>Change password</h2>
        <p>Use the Change Password option to update your account password at any time. Changing your password regularly helps keep your account secure</p>  
      
        <ol class="steps">
          <li>Click the Profile icon at the bottom of the navigation rail and select Change Password. Enter your new password, confirm it, and save the changes.</li>
        </ol>
        <figure class="figure">
          <img decoding="async" data-full-height="259" data-full-width="835" data-full-src="images/optimized/changePassword1a.webp" src="images/optimized/changePassword1a.webp" width="835" height="259"  alt="Change password flow 1a" loading="lazy" />

       <figure class="figure">

          {
            id: "access-management",
            title: "Access management",
            kind: "page",
            lede: "Role-based access control for secure and centralized user management.",
            content: `
        <p>The Access Management module provides centralized control over who can access the Orilla platform and what actions they are authorized to perform. It enables administrators to create roles, assign permissions, and manage user access individually or in group to platform resources such as devices, fleets, and edge actions.</p>

        <h2 id="the-access-management-panel">The Access Management panel</h2>
        <p>Navigate to the profile settings icon in the left sidebar to open <strong>Access Management</strong>.</p>
        <p>This page has two main sections-</p>
        <ul>
          <li><strong>All Roles</strong> — Lists every role created and associated info like number of users assigned and number of permissions granted. We can edit and delete roles as required.</li>
          <li><strong>Users and Groups</strong> — Shows which individual users or groups are mapped to the role selected above and lets you add new users via the <strong>Add User</strong>  button.</li>
        </ul>
        <figure class="figure">
          <img decoding="async" data-full-height="1636" data-full-width="3834" data-full-src="images/optimized/access_management.webp" src="images/optimized/access_management.preview.webp" width="1600" height="683" alt="Access Management panel" loading="lazy" />
          <figcaption><span class="label">Fig 2.1</span> Access Management panel</figcaption>
        </figure>

        <h3 id="a-creating-a-role">A. Creating a Role</h3>
        <ol class="steps">
          <li>Click <strong>Create Role</strong> on the Access Management page.</li>
          <li>On the Create a New Role screen, enter a Role Name and Role Description.</li>
          <li>Under Select Permissions, choose the specific permissions the role should have for Devices, Fleets, and Edge Actions or check Select All at the top-right to grant full access to every permission at once.</li>
          <li>Click Submit to save the role. It will now appear on the All-Roles table.</li>
        </ol>
        <figure class="figure">
          <img decoding="async" data-full-height="1370" data-full-width="3840" data-full-src="images/optimized/create_role.webp" src="images/optimized/create_role.preview.webp" width="1600" height="571" alt="Create Role page" loading="lazy" />
          <figcaption><span class="label">Fig 2.2</span> Create Role page</figcaption>
        </figure>

        <h3 id="b-adding-a-user-to-a-role">B. Adding a User to a Role</h3>
        <ol class="steps">
          <li>From the Access Management page, select the role you want to assign the user to.</li>
          <li>Click Add User in the Users and Groups panel.</li>
          <li>In the Add User dialog, enter the user's email address and select the role to assign from the dropdown (e.g., "Fleet Manager").</li>
          <li>Confirm to add the user.</li>
        </ol>
        <figure class="figure">
          <img decoding="async" data-full-height="1040" data-full-width="3840" data-full-src="images/optimized/add_user.webp" src="images/optimized/add_user.preview.webp" width="1600" height="433" alt="Add User page" loading="lazy" />
          <figcaption><span class="label">Fig 2.3</span> Add User page</figcaption>
        </figure>

        <h3 id="c-account-activation">C. Account Activation</h3>
        <ul>
          <li>Once the admin has added a new user's email address to a role, that user can complete their own account setup.</li>
          <li>They sign up with the same email the admin registered with them, set their own password, and verify their identity with an OTP before they can log in.</li>
        </ul>
        <figure class="figure">
          <img decoding="async" data-full-height="628" data-full-width="3604" data-full-src="images/optimized/user_activation.webp" src="images/optimized/user_activation.preview.webp" width="1600" height="279" alt="User Activation page" loading="lazy" />
          <figcaption><span class="label">Fig 2.4</span>User Activation page</figcaption>
        </figure> <figure class="figure">
          <img decoding="async" data-full-height="1880" data-full-width="3838" data-full-src="images/optimized/sign_up_mfa.webp" src="images/optimized/sign_up_mfa.preview.webp" width="1600" height="784" alt="Sign up with MFA" loading="lazy" />
          <figcaption><span class="label">Fig 2.5</span>Sign up with MFA</figcaption>
        </figure>
        <ul>  
          <li>Authentication email lands in the user's inbox with a 6-digit one-time password, valid for 5 minutes.</li>
        </ul>
       
        <figure class="figure">
          <img decoding="async" data-full-height="1700" data-full-width="3826" data-full-src="images/optimized/verify_email.webp" src="images/optimized/verify_email.preview.webp" width="1600" height="711" alt="Verify the email address by adding the received OTP" loading="lazy" />

        <ul>

        <figure class="figure">
          <img decoding="async" data-full-height="1536" data-full-width="3840" data-full-src="images/optimized/acc_verified.webp" src="images/optimized/acc_verified.preview.webp" width="1600" height="640" alt="Account Verified" loading="lazy" />
          <figcaption><span class="label">Fig 2.7</span>Account Verified</figcaption>
        </figure>


        <h3 id="d-group-access">D. Group Access</h3>
        <p>Instead of assigning a role to users one at a time, admins can also create a Group - a collection of users that all inherit the same role and permissions. This is useful for teams (e.g., a Dev team, a Support team) where everyone should have identical access.</p>
         <ul><li>From the Groups tab under Users and Groups, click <strong>Add Group</strong>.</li></ul>
       
        <figure class="figure">
          <img decoding="async" data-full-height="1796" data-full-width="3826" data-full-src="images/optimized/add_group.webp" src="images/optimized/add_group.preview.webp" width="1600" height="751" alt="Add Group" loading="lazy" />

    </script>

    <!-- ============================================================ -->
    <!-- App logic — renders sidebar + content from guideData.        -->
    <!-- ============================================================ -->
    <script>
      (function () {
        const sidebarList = document.getElementById("navList");
        const docEl = document.getElementById("doc");
        const onpageList = document.getElementById("onpageTocList");
        const crumbHere = document.getElementById("crumbHere");
        const search = document.getElementById("navSearch");
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const scrim = document.getElementById("scrim");
        const screenshotDialog = document.getElementById("screenshotDialog");
        const screenshotImage = document.getElementById("screenshotImage");
        const screenshotTitle = document.getElementById("screenshotTitle");
        const screenshotViewport =
          document.getElementById("screenshotViewport");
        const screenshotClose = document.getElementById("screenshotClose");
        let screenshotOpener = null;

        function resetScreenshotViewport() {
          screenshotViewport.scrollTop = 0;
          screenshotViewport.scrollLeft = 0;
        }

        function prepareScreenshots() {
          docEl.querySelectorAll(".figure img").forEach((img) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "screenshot-trigger";
            button.setAttribute("aria-label", "Enlarge screenshot: " + img.alt);
            button.setAttribute("aria-haspopup", "dialog");
            button.setAttribute("aria-controls", "screenshotDialog");
            img.replaceWith(button);
            button.appendChild(img);
            button.addEventListener("click", () => {
              screenshotOpener = button;
              const caption = button
                .closest("figure")
                .querySelector("figcaption");
              screenshotTitle.textContent = caption
                ? caption.textContent
                    .trim()
                    .replace(/\s+/g, " ")
                    .replace(/^(Fig\s+\d+(?:\.\d+)+)\s*/, "$1 — ")
                : img.alt;
              screenshotImage.alt = img.alt;
              screenshotImage.width = Number(
                img.dataset.fullWidth || img.width,
              );
              screenshotImage.height = Number(
                img.dataset.fullHeight || img.height,
              );
              screenshotImage.src = img.dataset.fullSrc || img.src;
              resetScreenshotViewport();
              screenshotDialog.showModal();
              document.body.classList.add("screenshot-open");
            });
          });
        }

        screenshotClose.addEventListener("click", () =>
          screenshotDialog.close(),
        );
        screenshotDialog.addEventListener("click", (event) => {
          if (event.target !== screenshotDialog) return;
          const bounds = screenshotDialog.getBoundingClientRect();
          if (
            event.clientX < bounds.left ||
            event.clientX > bounds.right ||
            event.clientY < bounds.top ||
            event.clientY > bounds.bottom
          )
            screenshotDialog.close();
        });
        screenshotDialog.addEventListener("close", () => {
          document.body.classList.remove("screenshot-open");
          screenshotImage.removeAttribute("src");
          resetScreenshotViewport();
          if (screenshotOpener?.isConnected)
            screenshotOpener.focus({ preventScroll: true });
          screenshotOpener = null;
        });

        // Build sidebar
        function renderSidebar() {
          sidebarList.innerHTML = "";
          guideData.sections.forEach((s, i) => {
            const li = document.createElement("li");
            li.className = "nav-item";
            li.dataset.id = s.id;
            li.innerHTML = `<a href="#${s.id}"><span class="nav-dot"></span><span>${s.title}</span></a>`;
            sidebarList.appendChild(li);
          });
        }

        // Render the active section's full content
        function renderSection(id, skipScroll) {
          if (screenshotDialog.open) screenshotDialog.close();
          const sec =
            guideData.sections.find((s) => s.id === id) ||
            guideData.sections[0];
          crumbHere.textContent = sec.title;
          document.title = `${sec.title} · ${guideData.title}`;

          let html = `
      <h1>${sec.title}</h1>
      ${sec.lede ? `<p class="lede">${sec.lede}</p>` : ""}
      <div class="meta-row">
        <span>📘 ${guideData.title}</span>
        <span>v${guideData.meta.version}</span>
        <span>Updated ${guideData.meta.updated}</span>
      </div>
      ${sec.content}
    `;
          docEl.innerHTML = html;
          prepareScreenshots();

          // Active state in sidebar
          document
            .querySelectorAll(".nav-item")
            .forEach((n) =>
              n.classList.toggle("active", n.dataset.id === sec.id),
            );

          // Build the TOC from explicit IDs shared with the hash router.
          onpageList.innerHTML = "";
          const heads = docEl.querySelectorAll("h2[id], h3[id], h5[id]");
          heads.forEach((h) => {
            const a = document.createElement("a");
            a.href = `#${h.id}`;
            a.textContent = h.textContent;
            a.className = h.tagName.toLowerCase();
            a.dataset.target = h.id;
            a.addEventListener("click", (ev) => {
              ev.preventDefault();
              const target = document.getElementById(a.dataset.target);
              if (target) {
                history.replaceState(null, "", "#" + a.dataset.target);
                target.scrollIntoView({ behavior: "smooth", block: "start" });
              }
            });
            onpageList.appendChild(a);
          });

          // Scroll content to top, anchor if present
          if (!skipScroll) {
            window.scrollTo(0, 0);
          }

          // close mobile sidebar
          sidebar.classList.remove("open");
          scrim.classList.remove("show");
        }

        // Routing
        function routeFromHash() {
          const raw = location.hash.replace(/^#/, "");
          if (!raw) {
            renderSection(guideData.sections[0].id);
            return;
          }

          // If anchor already exists on the current page, just scroll — no re-render.
          const here = document.getElementById(raw);
          if (here && docEl.contains(here)) {
            here.scrollIntoView({ behavior: "smooth", block: "start" });
            return;
          }

          // Top-level section id?
          const sec = guideData.sections.find((s) => s.id === raw);
          if (sec) {
            renderSection(raw);
            return;
          }

          // Sub-anchor — find which section contains it, render that section, then scroll.
          const owner = guideData.sections.find((s) =>
            (s.content || "").includes(`id="${raw}"`),
          );
          if (owner) {
            renderSection(owner.id, /*skipScroll*/ true);
            requestAnimationFrame(() => {
              const target = document.getElementById(raw);
              if (target)
                target.scrollIntoView({ behavior: "smooth", block: "start" });
            });
          } else {
            renderSection(guideData.sections[0].id);
          }
        }

        // Sidebar search — searches BOTH section titles and section content text.
        search.addEventListener("input", (e) => {
          const q = e.target.value.toLowerCase().trim();
          let visible = 0;
          document.querySelectorAll("#navList .nav-item").forEach((li) => {
            const id = li.dataset.id;
            const sec = guideData.sections.find((s) => s.id === id);
            const haystack = (
              (sec?.title || "") +
              " " +
              (sec?.lede || "") +
              " " +
              (sec?.content || "")
            )
              .replace(/<[^>]+>/g, " ")
              .toLowerCase();
            const match = !q || haystack.includes(q);
            li.style.display = match ? "" : "none";
            if (match) visible++;
          });
          let empty = document.getElementById("navEmpty");
          if (!empty) {
            empty = document.createElement("li");
            empty.id = "navEmpty";
            empty.style.cssText =
              "list-style:none;padding:8px 10px;color:var(--text-faint);font-size:12.5px;font-style:italic;";
            empty.textContent = "No matches";
            sidebarList.appendChild(empty);
          }
          empty.style.display = q && visible === 0 ? "" : "none";
        });

        // Mobile menu
        menuBtn.addEventListener("click", () => {
          sidebar.classList.add("open");
          scrim.classList.add("show");
        });
        scrim.addEventListener("click", () => {
          sidebar.classList.remove("open");
          scrim.classList.remove("show");
        });

        // On-page TOC scroll-spy
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                const id = e.target.id;
                document.querySelectorAll("#onpageTocList a").forEach((a) => {
                  a.classList.toggle("active", a.dataset.target === id);
                });
              }
            });
          },
          { rootMargin: "-80px 0px -70% 0px", threshold: 0 },
        );

        // Track the same headings as the TOC after content rerenders.
        const mo = new MutationObserver(() => {
          observer.disconnect();
          docEl
            .querySelectorAll("h2[id], h3[id], h5[id]")
            .forEach((h) => observer.observe(h));
        });
        mo.observe(docEl, { childList: true });

        // Init
        renderSidebar();
        routeFromHash();
        window.addEventListener("hashchange", routeFromHash);
      })();
    </script>
